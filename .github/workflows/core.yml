name: core

# ADR 0011: fmt, clippy, test and cargo deny for the Rust core on every push
# and pull request.
on:
  push:
  pull_request:

concurrency:
  group: core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    working-directory: core

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # cpal's ALSA backend (ristle-audio) links against libasound.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # cpal's ALSA backend (ristle-audio) links against libasound.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo test --workspace --all-features --locked

  # The Android build of the crates with Android-only code (ADR 0004: the
  # AAudio output). Cross-compiled and linted; CI cannot run it.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo ndk -t arm64-v8a -t x86_64 --platform 28 clippy -p ristle-audio --all-targets --all-features --locked -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check
          arguments: --all-features

  bindings:
    # ADR 0001: Kotlin and Swift bindings generated in library mode from an
    # unstripped build, compiled, and run against the real library. No app
    # builds; phase 3 and phase 6 build those.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # cpal's ALSA backend (ristle-audio) links against libasound.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Generate
        run: tools/check-bindings.sh generate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin compiler
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          echo "81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420  kotlinc.zip" | sha256sum --check
          unzip -q kotlinc.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Kotlin
        run: tools/check-bindings.sh kotlin
      - name: Swift (Swift 5 module)
        run: tools/check-bindings.sh swift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bindings
          path: core/target/bindings-check/generated
          retention-days: 7

  android:
    # The facade cross-compiles for Android (M1). Full Android builds start
    # with phase 3.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (core/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: cargo ndk check
        # The runner's ANDROID_NDK_ROOT names its NDK.
        run: cargo ndk -t arm64-v8a check --locked -p ristle-ffi
