name: local-files

# ADR 0011: the Local Files Plugin (plugins/local-files/), its own Cargo
# project because it builds a component. Licences are checked against the
# core's policy (core/deny.toml).
on:
  push:
  pull_request:

concurrency:
  group: local-files-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    working-directory: plugins/local-files

jobs:
  app-local-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (plugins/local-files/rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/local-files
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy (wasm32-wasip2, the component target)
        run: cargo clippy --target wasm32-wasip2 --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked

  app-local-files-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: plugins/local-files/Cargo.toml
          command: check
          arguments: --config core/deny.toml
