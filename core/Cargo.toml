[workspace]
resolver = "3"
members = ["crates/*", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/THEN00P/Ristle-next"
publish = false

# Internal crates. Each crate states only the edges it is allowed to have; the
# dependency direction is documented in docs/plan/phase-2.md ("Crate layout").
[workspace.dependencies]
ristle-domain = { path = "crates/domain" }
ristle-queue = { path = "crates/queue" }
ristle-storage = { path = "crates/storage" }
ristle-net = { path = "crates/net" }
ristle-plugin-host = { path = "crates/plugin-host" }
ristle-media = { path = "crates/media" }
ristle-audio = { path = "crates/audio" }
ristle-protocol = { path = "crates/protocol" }
ristle-party = { path = "crates/party" }
ristle-app = { path = "crates/app" }

# ristle-media (M6a).
symphonia = { version = "0.6.1", default-features = false }
symphonia-adapter-libopus = "0.3.0"
thiserror = "2"
tracing = "0.1"
aes = "0.8"
async-trait = "0.1"
bytes = "1"
cbc = "0.1"
ctr = "0.9"
tokio = { version = "1", default-features = false }
url = "2"
cpal = "0.18.2"
libc = "0.2"
ndk = { version = "0.9", default-features = false }
rtrb = "0.4"
rubato = "0.16"
# Pinned exactly: the bindgen CLI (tools/uniffi-bindgen) must match the
# scaffolding in ristle-ffi.
uniffi = "=0.32.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# ristle-queue (M2): seeded shuffles.
rand_chacha = { version = "0.9", default-features = false }
# ristle-storage (M3). SQLite is compiled in, so every platform runs the
# same version.
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
# ristle-net (M4).
http = "1"
http-body-util = "0.1.3"
httparse = "1.10"
httpdate = "1"
hyper = { version = "1.12", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
rustls = { version = "0.23.40", default-features = false }
tower-service = "0.3"
tokio-rustls = { version = "0.26.4", default-features = false }
webpki-roots = "1"
# ristle-plugin-host (M5).
ed25519-dalek = { version = "2.2", default-features = false }
semver = "1.0.28"
sha2 = "0.10.9"
toml = { version = "0.9.12", default-features = false }
wasmsign2 = { version = "0.2.8", default-features = false }
wasmtime = { version = "49.0.3", default-features = false }
wit-component = "0.261"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# The core never panics across the UniFFI boundary (ADR 0001). Tests may
# unwrap; see clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# Keep symbols: uniffi-bindgen reads its metadata from them (ADR 0001).
# Packaging (AGP, Xcode) strips.
strip = false
debug = 1
