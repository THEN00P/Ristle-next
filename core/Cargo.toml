[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/THEN00P/Ristle-next"
publish = false

# Internal crates. Each crate states only the edges it is allowed to have; the
# dependency direction is documented in docs/plan/phase-2.md ("Crate layout").
[workspace.dependencies]
ristle-domain = { path = "crates/domain" }
ristle-queue = { path = "crates/queue" }
ristle-storage = { path = "crates/storage" }
ristle-net = { path = "crates/net" }
ristle-plugin-host = { path = "crates/plugin-host" }
ristle-media = { path = "crates/media" }
ristle-audio = { path = "crates/audio" }
ristle-protocol = { path = "crates/protocol" }
ristle-party = { path = "crates/party" }
ristle-app = { path = "crates/app" }

# External crates, added by the PR that first uses each.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# The core never panics across the UniFFI boundary (ADR 0001). Tests may
# unwrap; see clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# Keep symbols: uniffi-bindgen reads its metadata from them (ADR 0001).
# Packaging (AGP, Xcode) strips.
strip = false
debug = 1
