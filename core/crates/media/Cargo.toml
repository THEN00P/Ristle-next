[package]
name = "ristle-media"
description = "Stream Sources to decoded PCM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ristle-domain.workspace = true
ristle-net.workspace = true
# Symphonia demuxes the containers it reads and decodes everything but Opus
# and HE-AAC (ADR 0004). Only what the host uses is enabled.
symphonia = { workspace = true, features = [
    "opt-simd",
    "aac",
    "alac",
    "flac",
    "mp1",
    "mp2",
    "mp3",
    "pcm",
    "adpcm",
    "vorbis",
    "isomp4",
    "ogg",
    "mkv",
    "wav",
    "aiff",
    "caf",
    "id3v2",
] }
# libopus (BSD-3-Clause) for Opus on every platform. Builds with cmake.
symphonia-adapter-libopus.workspace = true
thiserror.workspace = true
tracing.workspace = true
# HLS AES-128, host-side AES-CTR/CBC decryption, background fetching.
aes.workspace = true
async-trait.workspace = true
bytes.workspace = true
cbc = { workspace = true, features = ["block-padding"] }
ctr.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
url.workspace = true

# MediaCodec, the platform HE-AAC decoder on Android (ADR 0004).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { workspace = true, features = ["media", "api-level-28"] }

[dev-dependencies]
aes.workspace = true
async-trait.workspace = true
bytes.workspace = true
cbc = { workspace = true, features = ["block-padding", "alloc"] }
ctr.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
