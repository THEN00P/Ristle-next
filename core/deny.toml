# cargo-deny policy for the core (ADR 0009, ADR 0011).
#
# The core ships as GPL-3.0-or-later, so every dependency's licence must be
# one that can be combined into a GPL-3.0 work. Anything not listed below is
# rejected, including licences cargo-deny cannot identify.

[graph]
all-features = true

[advisories]
# Vulnerabilities and yanked crates fail the build. Unmaintained crates are
# reported for direct dependencies of workspace crates.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# The list is the policy, not an inventory of what the graph uses today.
unused-allowed-license = "allow"
allow = [
    # Our own crates.
    "GPL-3.0-or-later",
    # Permissive licences compatible with GPL-3.0.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft compatible with GPL-3.0.
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
]
# Not allowed, on purpose:
# - "OpenSSL" (the old OpenSSL/SSLeay licence, GPL-incompatible).
# - FDK AAC's licence (GPL-incompatible, ADR 0004). Its crates are banned by
#   name below, because `fdk-aac-sys` declares MIT for its bindings and would
#   otherwise pass.
# - GPL-2.0-only, SSPL, BUSL, Commons Clause and anything proprietary.

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "fdk-aac", reason = "FDK AAC is not GPL-compatible (ADR 0004)" },
    { crate = "fdk-aac-sys", reason = "FDK AAC is not GPL-compatible (ADR 0004)" },
    { crate = "symphonia-adapter-fdk-aac", reason = "FDK AAC is not GPL-compatible (ADR 0004)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
