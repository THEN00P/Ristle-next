[package]
name = "ristle-local-files"
description = "The Local Files Plugin: music in folders the user granted."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/THEN00P/Ristle-next"
publish = false

[dependencies]
# The default feature (compressed ID3v2 frames) is also needed to build at all.
lofty = "0.25.4"
thiserror = "2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# A Plugin trap fails the call (ADR 0003); errors are returned instead.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
