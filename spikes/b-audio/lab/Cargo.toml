[package]
name = "audiolab"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "audiolab"
path = "src/main.rs"

[features]
default = ["libopus", "fdk"]
# C decoders behind Symphonia adapters, for comparison only.
libopus = ["dep:symphonia-adapter-libopus"]
fdk = ["dep:symphonia-adapter-fdk-aac", "dep:fdk-aac"]

[dependencies]
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = { version = "0.3.0", optional = true }
symphonia-adapter-fdk-aac = { version = "0.2.0", optional = true }
fdk-aac = { version = "0.8.0", optional = true }
anyhow = "1"
rubato = "0.16"
ureq = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
url = "2"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media"] }
