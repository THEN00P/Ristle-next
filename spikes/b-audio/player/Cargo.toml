[package]
name = "ristle-audio-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "ristle_audio"
crate-type = ["cdylib", "lib"]

[dependencies]
audiolab = { path = "../lab", default-features = false, features = ["libopus"] }
symphonia = { version = "0.6.1", features = ["all"] }
cpal = "0.18.2"
rtrb = "0.3"
uniffi = "0.32.2"
thiserror = "2"
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
ndk-context = "0.1.1"
jni-sys = "0.3"
log = "0.4"
